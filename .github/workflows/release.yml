name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore keystore
        env:
          KS_B64: ${{ secrets.WATCHHUB_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 --decode > "$GITHUB_WORKSPACE/watchhub.keystore"
          ls -l "$GITHUB_WORKSPACE/watchhub.keystore"

      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build signed APK
        working-directory: android
        env:
          WATCHHUB_KEYSTORE: ${{ github.workspace }}/watchhub.keystore
          WATCHHUB_STORE_PASS: ${{ secrets.WATCHHUB_STORE_PASS }}
          WATCHHUB_KEY_ALIAS: watchhub
          WATCHHUB_KEY_PASS: ${{ secrets.WATCHHUB_STORE_PASS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify signature
        run: |
          SDK="$ANDROID_HOME/build-tools/34.0.0"
          "$SDK/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Collect version
        id: ver
        run: |
          G=android/app/build.gradle.kts
          CODE=$(sed -n "s/.*versionCode = //p" "$G" | tr -d " ")
          NAME=$(sed -n "s/.*versionName = //p" "$G" | tr -d " " | tr -d "\042")
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$NAME" ;; esac
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          CODE: ${{ steps.ver.outputs.code }}
          VNAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk WatchHub.apk
          python3 scripts/make_manifest.py --apk WatchHub.apk --tag "$TAG" --code "$CODE" --name "$VNAME" --repo "$GITHUB_REPOSITORY" --out dist/latest.json
          cat dist/latest.json

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: WatchHub ${{ steps.ver.outputs.name }}
          files: WatchHub.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit manifest
        run: |
          set -euo pipefail
          cp dist/latest.json /tmp/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          mkdir -p dist
          cp /tmp/latest.json dist/latest.json
          if git diff --quiet dist/latest.json; then echo no-change; exit 0; fi
          git add -f dist/latest.json
          git commit -m "chore: manifest ${{ steps.ver.outputs.name }}"
          git push origin master
