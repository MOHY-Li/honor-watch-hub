name: CI

# master 每次推送（和 PR）都跑单测 + lint：坏提交不等发版才暴露。
# 发布产物仍走 release.yml（tag 触发）。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与 release.yml 相同：settings.gradle.kts 里的 aliyun 镜像给本地国内构建提速，
      # 海外 runner 走它偶发 502，删掉走官方源。
      - name: Strip aliyun mirrors on CI
        run: |
          sed -i '/maven.aliyun.com/d' android/settings.gradle.kts
          cat android/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon
