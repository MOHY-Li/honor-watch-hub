services:
  watchhub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: watchhub
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      WATCHHUB_TOKEN: ""      # 留空则自动生成到 data/token.txt
      WATCHHUB_CONFIG: /data/sources.yaml
