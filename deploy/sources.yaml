# WatchHub 运行配置。改完重启服务端生效。
# 语法：顶格 = 源名字，两空格缩进 = 该源的键值；支持一层嵌套块（fields）。

# ---- 1) 番剧更新（Bangumi 官方 API，实测可用）----
# subject_id 换成你在 bangumi.tv 上追的番的 ID：网址 /subject/425998 里的数字
bangumi:
  kind: json
  url: https://api.bgm.tv/v0/episodes?subject_id=425998&type=0&limit=20
  list_path: data
  limit: 20
  interval: 900
  priority: high
  tags: [anime, 番剧]
  fields:
    title: name_cn
    key: id
    body: airdate
    url: id

# ---- 2) 定时提醒：工作日喝水 ----
drink_water:
  kind: cron
  times: ["09:30", "11:30", "14:30", "16:30"]
  days: [0, 1, 2, 3, 4]
  title: 喝水
  body: 起来走两步，喝口水
  priority: high
  tags: [health]

# ---- 3) 任意 RSS（示例：少数派）----
sspai:
  kind: rss
  url: https://sspai.com/feed
  interval: 1800
  limit: 5
  priority: low
  tags: [web]
  enabled: false

# ---- 4) 整页指纹：抢票 / 补货 / 公告 ----
page_watch:
  kind: hash
  url: https://example.com/product/123
  interval: 1800
  title: 商品页有变化
  body: 价格或库存更新了
  priority: high
  tags: [shopping]
  enabled: false
